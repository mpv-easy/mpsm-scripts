name: Releases

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: "build ts"
        run: |
          bun i
          bun run build

          mkdir -p ./release
          cp ./scripts/* ./release/
          cp ./es5/* ./release/
          cp ./script-opts/* ./release/
          cp ./lua/* ./release/


      - uses: ncipollo/release-action@v1
        with:
          artifacts: "./release/*"
